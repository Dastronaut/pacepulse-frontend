name: pacepulse
description: "PacePulse — GPS + BLE workout tracking with live challenges."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  google_fonts: ^8.2.1
  lucide_icons_flutter: ^3.1.15
  riverpod_annotation: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.4
  build_runner: ^2.15.1
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true

  # google_fonts resolves these by exact variant filename (Inter-<Variant>.ttf),
  # so fonts work offline on first launch. Current files are variable-font
  # stand-ins — swap for licensed/static instances before release.
  assets:
    - assets/fonts/
