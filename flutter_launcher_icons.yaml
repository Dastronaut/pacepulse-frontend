# App icon generation — source of truth is assets/icon/app_icon_master.svg
# (D3 brief: Slate canvas, Ember start-gate ring, 28° gap at 12 o'clock).
# Regenerate all platform sizes with: fvm dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#25343F"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"
